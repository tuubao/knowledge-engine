server:
  port: ${JAVA_PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: knowledge-business-service
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/knowledge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_SIZE:20MB}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input
app:
  upload-dir: ${JAVA_UPLOAD_DIR:./data/uploads}
  token-hours: ${TOKEN_HOURS:24}
  engine:
    base-url: ${RAG_ENGINE_URL:http://127.0.0.1:8000}
    service-key: ${RAG_SERVICE_KEY:}
    connect-timeout-seconds: ${RAG_CONNECT_TIMEOUT_SECONDS:5}
    request-timeout-seconds: ${RAG_REQUEST_TIMEOUT_SECONDS:120}
    ingest-timeout-seconds: ${RAG_INGEST_TIMEOUT_SECONDS:600}
    stream-timeout-seconds: ${RAG_STREAM_TIMEOUT_SECONDS:180}
  jobs:
    workers: ${INGEST_WORKERS:2}
    queue-capacity: ${INGEST_QUEUE_CAPACITY:8}
  streams:
    workers: ${STREAM_WORKERS:4}
    queue-capacity: ${STREAM_QUEUE_CAPACITY:16}
